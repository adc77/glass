[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "glass"
version = "0.2.0"
description = "A lab-sample pipeline that adopts the seam SDK."
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
dependencies = ["seam @ git+https://github.com/adc77/seam.git@f20a79959432e88dd1ef880a328796e0cabdfc78"]

[tool.setuptools.packages.find]
include = ["glass*"]

[tool.setuptools.package-data]
glass = ["cases/*.json"]
