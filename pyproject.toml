[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "glass"
version = "0.6.2"
description = "A lab-sample pipeline that adopts the seam SDK."
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
dependencies = ["seam @ git+https://github.com/adc77/seam.git@ccee8cf07f19c673d607b825d624d50f0199533b"]

[project.scripts]
glass-capture = "glass.capture_cli:main"
glass-demo = "glass.demo:main"

[tool.setuptools.packages.find]
include = ["glass*"]

[tool.setuptools.package-data]
glass = ["cases/*.json"]
