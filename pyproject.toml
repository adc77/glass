[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "glass"
version = "0.8.0"
description = "A lab-sample pipeline that adopts the seam SDK."
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
dependencies = ["seam @ git+https://github.com/adc77/seam.git@7a3559d13a13463eb8635638be2b9922f0fb20c3"]

[project.scripts]
glass-capture = "glass.capture_cli:main"
glass-demo = "glass.demo:main"
glass-workbench = "glass.workbench:main"

[tool.setuptools.packages.find]
include = ["glass*"]

[tool.setuptools.package-data]
glass = ["cases/*.json", "workbench_static/*.html", "workbench_static/*.css", "workbench_static/*.js"]
