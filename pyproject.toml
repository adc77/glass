[project]
name = "glass"
version = "0.1.0"
description = "A lab-sample pipeline that adopts the seam SDK."
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"

[tool.setuptools.packages.find]
include = ["glass*"]

[tool.setuptools.package-data]
glass = ["cases/*.json"]
